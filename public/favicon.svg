<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Cinema Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.35" fill="none"/>

  <!-- Cinema Frame / Reel Motif -->
  <g transform="translate(256, 256)">
    <!-- Outer Ticket/Frame Shape -->
    <rect x="-144" y="-120" width="288" height="240" rx="40" fill="#181D2D" stroke="url(#goldGrad)" stroke-width="12"/>

    <!-- Left Perforations -->
    <rect x="-128" y="-94" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="-128" y="-52" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="-128" y="-11" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="-128" y="30" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="-128" y="72" width="22" height="22" rx="6" fill="url(#goldGrad)"/>

    <!-- Right Perforations -->
    <rect x="106" y="-94" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="106" y="-52" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="106" y="-11" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="106" y="30" width="22" height="22" rx="6" fill="url(#goldGrad)"/>
    <rect x="106" y="72" width="22" height="22" rx="6" fill="url(#goldGrad)"/>

    <!-- Screen Area -->
    <rect x="-88" y="-96" width="176" height="192" rx="20" fill="#0A0D15"/>

    <!-- SynemaX Stylized Cinema 'S' in Vibrant Gold -->
    <path d="M28 -50 C-10 -58, -48 -35, -48 -6 C-48 24, 46 16, 46 48 C46 76, -4 84, -32 64" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    
    <!-- Center Play Accent -->
    <polygon points="-6,-18 20,0 -6,18" fill="url(#goldBright)"/>
  </g>

  <!-- Cinema Sparkle Star -->
  <path d="M380 92 L388 112 L408 120 L388 128 L380 148 L372 128 L352 120 L372 112 Z" fill="url(#goldBright)"/>
</svg>